[global]
pid = /tmp/php-fpm.pid
error_log = /dev/stderr
daemonize = no

[www]
ping.path = /php-ping
ping.response = ok
user = 10001
group = 10001
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
catch_workers_output = yes
clear_env = yes
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[upload_max_filesize] = 40M
php_admin_value[post_max_size] = 48M
php_admin_value[memory_limit] = 256M
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[open_basedir] = /app:/data:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source
