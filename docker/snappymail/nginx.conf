# nginx for SnappyMail: unprivileged (UID 10001), read-only root, PHP-FPM over a unix socket in /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  client_max_body_size 40m;          # attachments (PHP: upload_max_filesize 40M)
  limit_req_zone $binary_remote_addr zone=login:5m rate=30r/m;

  # The client address comes from Traefik (X-Forwarded-For); only the pod network can reach this port.
  set_real_ip_from 10.42.0.0/16;
  set_real_ip_from fd42::/56;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 8080;
    listen [::]:8080;
    root /app;
    index index.php;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Health = php-fpm answers its ping (nginx alone being up is not enough).
    location = /healthz {
      access_log off;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_NAME /php-ping;
      fastcgi_param SCRIPT_FILENAME /php-ping;
      fastcgi_pass unix:/tmp/php-fpm.sock;
    }

    # Never serve data, configs, dotfiles or sources.
    location ~ /\. { deny all; }
    location ~* ^/(data|snappymail/v/[^/]+/(app|include\.php)) { deny all; }
    location = /include.php { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /index.php {
      limit_req zone=login burst=20 nodelay;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param HTTPS on;
      fastcgi_pass unix:/tmp/php-fpm.sock;
      fastcgi_read_timeout 120s;
    }
    # Only the entry point runs PHP.
    location ~ \.php$ { return 404; }

    location ~* \.(?:js|css|woff2?|png|svg|ico|gif|jpg)$ {
      expires 7d;
      add_header Cache-Control "public";
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
